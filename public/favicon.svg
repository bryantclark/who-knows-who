<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clean white background with rounded corners -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="white" />
  
  <!-- Connections (Darker grey for contrast) -->
  <g stroke="#333" stroke-width="2.5" stroke-linecap="round">
    <!-- L1 (16,22), (16,42) to L2 (32,12), (32,32), (32,52) -->
    <line x1="16" y1="22" x2="32" y2="12" />
    <line x1="16" y1="22" x2="32" y2="32" />
    <line x1="16" y1="22" x2="32" y2="52" />
    
    <line x1="16" y1="42" x2="32" y2="12" />
    <line x1="16" y1="42" x2="32" y2="32" />
    <line x1="16" y1="42" x2="32" y2="52" />

    <!-- L2 to L3 (48,32) -->
    <line x1="32" y1="12" x2="48" y2="32" />
    <line x1="32" y1="32" x2="48" y2="32" />
    <line x1="32" y1="52" x2="48" y2="32" />
  </g>

  <!-- Nodes (Deep Orange #FF5722) -->
  <g fill="#FF5722" stroke="#333" stroke-width="1.5">
    <!-- Layer 1 -->
    <circle cx="16" cy="22" r="5.5" />
    <circle cx="16" cy="42" r="5.5" />
    
    <!-- Layer 2 -->
    <circle cx="32" cy="12" r="5.5" />
    <circle cx="32" cy="32" r="5.5" />
    <circle cx="32" cy="52" r="5.5" />
    
    <!-- Layer 3 -->
    <circle cx="48" cy="32" r="5.5" />
  </g>
</svg>
